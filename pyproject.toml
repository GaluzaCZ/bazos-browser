[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bazos-browser"
version = "0.1.0"
description = "CLI application for searching and storing vehicle offers from Bazos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
bazos-browser = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*", "bazos_sniper*", "offers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
